<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>광평중 탐험대</title>
<meta name="description" content="광평중학교를 미니미로 돌아다니며 도장을 모으는 학교 탐험 게임">
<meta name="theme-color" content="#24352b">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--ink:#1f2a24;--paper:#fbf6ea;--line:#2a3a30;--green:#3f8a5c;--green-d:#2c6844;--brick:#b5523b;--gold:#e9b84a;--sky:#7fb3d5;--muted:#6b7a70}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#24352b;color:var(--ink);font-family:Pretendard,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:3px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 16px;font-weight:800;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--green);color:#fff}
.btn.gold{background:var(--gold)}
/* 시작 화면 */
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,24,.35);overflow:auto}
.card{background:var(--paper);border:3px solid var(--line);border-radius:18px;box-shadow:0 8px 0 var(--line);width:min(440px,100%);padding:20px 18px;max-height:calc(100% - 8px);overflow:auto}
.logo{font-size:30px;font-weight:900;letter-spacing:-1px;line-height:1.1;margin:0}
.logo small{display:block;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0;margin-top:6px}
.row{display:flex;gap:10px;align-items:center}
label.f{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
input.t{width:100%;border:3px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:17px;font-weight:700;background:#fff}
.maker{display:flex;gap:12px;align-items:stretch;margin-top:6px}
#preview{width:112px;height:140px;border:3px solid var(--line);border-radius:12px;background:#cfe6c4;image-rendering:pixelated;flex:none}
.parts{flex:1;display:flex;flex-direction:column;gap:4px;justify-content:center}
.part{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.part span{flex:1;text-align:center}
.part button{width:30px;height:28px;border:2px solid var(--line);border-radius:8px;background:#fff;font-weight:900;padding:0}
.note{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
/* 게임 화면 위 */
#hud{position:fixed;inset:0;pointer-events:none}
#hud .tl{position:absolute;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pill{background:rgba(251,246,234,.95);border:3px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;white-space:nowrap}
.pill.dark{background:rgba(31,42,36,.85);color:#fff;border-color:#0d1410}
#hud .tr{position:absolute;right:max(10px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;gap:6px;pointer-events:auto}
.ico{width:46px;height:46px;border:3px solid var(--line);border-radius:12px;background:var(--paper);font-weight:900;font-size:13px;box-shadow:0 3px 0 var(--line);padding:0;line-height:1.05}
.ico:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#timer{position:absolute;top:max(64px,calc(env(safe-area-inset-top) + 56px));left:50%;transform:translateX(-50%);font-size:16px}
#timer.hot{background:#c0392b;color:#fff;animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}
#prompt{position:absolute;left:50%;bottom:calc(185px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:15px}
#ctl{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:auto auto;gap:10px;align-items:end;pointer-events:auto}
.big{width:78px;height:78px;border-radius:50%;border:4px solid var(--line);background:var(--gold);font-weight:900;font-size:17px;box-shadow:0 5px 0 var(--line)}
.mid{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:var(--paper);font-weight:900;font-size:13px;box-shadow:0 4px 0 var(--line)}
.big:active,.mid:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mid.on{background:#9ad0a8}
#stick{position:fixed;width:120px;height:120px;border-radius:50%;border:3px solid rgba(255,255,255,.6);background:rgba(0,0,0,.18);pointer-events:none;transform:translate(-50%,-50%)}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);border:3px solid var(--line)}
#toasts{position:fixed;left:50%;top:max(132px,calc(env(safe-area-inset-top) + 124px));transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:rgba(31,42,36,.92);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* 팝업 */
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,16,12,.55);pointer-events:auto}
.modal .card{animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.modal h2{margin:0 0 4px;font-size:21px;font-weight:900}
.modal .sub{margin:0 0 12px;color:var(--muted);font-size:13px;font-weight:700}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices .btn{text-align:left;font-size:16px}
.choices .btn.right{background:#9ad0a8}
.choices .btn.wrong{background:#f0a597}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid button{border:3px solid var(--line);border-radius:12px;background:#fff;font-size:26px;padding:8px 0}
.say button{font-size:14px;font-weight:800;padding:10px 4px}
.say{grid-template-columns:repeat(2,1fr)}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.li{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:7px 10px;background:#fff;font-weight:700;font-size:14px}
.li b{flex:1}
.li.me{background:#fff3c9}
.li.got{background:#e3f2e6}
.li .st{font-weight:900}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);border-radius:999px;background:#fff;padding:5px 12px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--green);color:#fff}
.mapwrap{overflow:auto;border:3px solid var(--line);border-radius:10px;background:#1b1f24;max-height:58vh;touch-action:pan-x pan-y}
#mapc{display:block}
.card.wide{width:min(980px,100%)}
.cert{text-align:center}
.cert .big-t{font-size:26px;font-weight:900;margin:6px 0}
.cert .stamp{display:inline-block;border:4px solid var(--brick);color:var(--brick);border-radius:50%;width:92px;height:92px;line-height:84px;font-weight:900;font-size:18px;transform:rotate(-12deg);margin:8px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (max-width:520px){#hud .tr{flex-direction:column}}
@media (max-height:520px){.big{width:64px;height:64px}.mid{width:50px;height:50px}#prompt{bottom:110px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <div class="card">
    <h1 class="logo">광평중 탐험대<small>우리 학교를 미니미로 돌아다니며 도장 12개를 모아 보세요</small></h1>
    <label class="f" for="nick">별명 (실명 말고 별명!)</label>
    <input class="t" id="nick" maxlength="8" placeholder="예: 소나무01" autocomplete="off">
    <label class="f">내 미니미 꾸미기</label>
    <div class="maker">
      <canvas id="preview" width="112" height="140"></canvas>
      <div class="parts" id="parts"></div>
    </div>
    <label class="f" for="room">우리 반 방 코드 <span style="font-weight:600;color:var(--muted)">(비우면 전체 광장)</span></label>
    <input class="t" id="room" maxlength="12" placeholder="예: 1-3" autocomplete="off">
    <div class="row" style="margin-top:16px">
      <button class="btn" id="rand" style="flex:none">무작위</button>
      <button class="btn go" id="go" style="flex:1;font-size:18px">탐험 시작</button>
    </div>
    <p class="note">같은 방 코드를 넣은 친구끼리 서로 보여요. 지도는 학교 설계 자료와 위성사진을 바탕으로 만든 것이라 실제 교실 위치와 다를 수 있어요.</p>
  </div>
</div>

<div id="hud" hidden>
  <div class="tl">
    <div class="pill" id="where">운동장</div>
    <div class="pill dark" id="score">도장 0/12 · 별 0/40</div>
    <div class="pill dark" id="net" style="font-size:12px">연결 중…</div>
  </div>
  <div class="tr">
    <button class="ico" id="bMap" title="지도(M)">지도</button>
    <button class="ico" id="bMis" title="미션(Q)">미션</button>
    <button class="ico" id="bRank" title="순위(R)">순위</button>
    <button class="ico" id="bSnd" title="소리">소리<br>켬</button>
  </div>
  <div class="pill dark" id="timer" hidden></div>
  <div class="pill" id="prompt" hidden></div>
  <div id="ctl">
    <button class="mid" id="bEmo">표정</button>
    <button class="mid" id="bSay">말</button>
    <button class="mid" id="bRun">달리기</button>
    <button class="big" id="bAct">확인</button>
  </div>
</div>
<div id="stick" hidden><i></i></div>
<div id="toasts"></div>
<div class="modal" id="modal" hidden><div class="card" id="mbody"></div></div>

<script>
"use strict";
// ================= 기본 =================
const T = 32;                       // 타일 한 칸(월드 px)
const $ = (s) => document.querySelector(s);
const cv = $("#cv"), ctx = cv.getContext("2d");
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ================= 타일 =================
const K = {
  VOID: 0, WALL: 1, WOOD: 2, HALL: 3, GRASS: 4, DIRT: 5, ASPH: 6, TREE: 7, FENCE: 8, ROOFG: 9, ROOFD: 10, ROOFW: 11,
  BRICK: 12, GLASSW: 13, PAVE: 14, SEAT: 15, COURT: 16, TILE: 17, STAIR: 18, DESK: 19, BOARD: 20, SHELF: 21, LAB: 22,
  PIANO: 23, PC: 24, BED: 25, FLOWER: 26, BENCH: 27, GOAL: 28, LOCKER: 29, TABLE: 30, EASEL: 31, SOFA: 32, CAR: 33,
  DOOR: 35, WIN: 36, TROPHY: 37, STALL: 38, TDESK: 39, HOOP: 40, STAGE: 41, APT: 42, ROAD: 43, PINE: 44, MAGNO: 45,
  STAND: 46, MUSIC: 47, SINK: 48, WOODD: 49,
};
const SOLID = new Set([K.VOID, K.WALL, K.TREE, K.FENCE, K.ROOFG, K.ROOFD, K.ROOFW, K.BRICK, K.GLASSW, K.SEAT, K.DESK, K.BOARD, K.SHELF, K.LAB,
  K.PIANO, K.PC, K.BED, K.FLOWER, K.BENCH, K.GOAL, K.LOCKER, K.TABLE, K.EASEL, K.SOFA, K.CAR, K.WIN, K.TROPHY, K.STALL, K.TDESK, K.HOOP,
  K.STAGE, K.APT, K.ROAD, K.PINE, K.MAGNO, K.STAND, K.SINK]);
// 바닥처럼 밑에 깔 타일(가구 아래)
const UNDER = { [K.DESK]: K.WOOD, [K.TDESK]: K.WOOD, [K.SHELF]: K.WOOD, [K.LAB]: K.TILE, [K.PIANO]: K.WOOD, [K.PC]: K.WOOD, [K.BED]: K.TILE,
  [K.TABLE]: K.TILE, [K.EASEL]: K.WOOD, [K.SOFA]: K.WOOD, [K.LOCKER]: K.WOOD, [K.TROPHY]: K.HALL, [K.STALL]: K.TILE, [K.SINK]: K.TILE,
  [K.HOOP]: K.COURT, [K.MUSIC]: K.WOOD, [K.STAND]: K.WOOD, [K.CAR]: K.ASPH, [K.BENCH]: K.GRASS, [K.FLOWER]: K.GRASS, [K.TREE]: K.GRASS,
  [K.PINE]: K.GRASS, [K.MAGNO]: K.GRASS, [K.GOAL]: K.DIRT };

// ================= 지역(지도) 만들기 =================
const AREAS = [];
function newArea(id, name, w, h, fill) {
  const a = { id, name, w, h, t: new Uint8Array(w * h).fill(fill), rooms: [], warps: new Map(), signs: [], objs: [], base: null };
  AREAS[id] = a; return a;
}
const at = (a, x, y) => (x < 0 || y < 0 || x >= a.w || y >= a.h) ? K.VOID : a.t[y * a.w + x];
const set = (a, x, y, k) => { if (x >= 0 && y >= 0 && x < a.w && y < a.h) a.t[y * a.w + x] = k; };
const rect = (a, x0, y0, x1, y1, k) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(a, x, y, k); };
const warp = (a, x, y, to, tx, ty, label) => a.warps.set(y * a.w + x, { to, tx, ty, label });

// 방 설명 — 들어가면 위에 뜬다
const DESC = {
  "교무실": "선생님들이 일하시는 곳. 들어갈 땐 노크하고 인사!", "행정실": "학교 살림(시설·서류)을 맡는 곳", "교장실": "교장선생님 방",
  "보건실": "아프거나 다쳤을 때 가는 곳", "메인홀": "모든 건물로 이어지는 학교의 한가운데", "Wee클래스": "고민을 편하게 이야기하는 상담실",
  "도서관": "책 읽고 빌리는 곳. 쉿, 조용히!", "강당 가는 길": "강당과 급식실로 이어지는 통로", "방송실": "점심 방송·행사 방송을 하는 곳",
  "과학실": "실험하고 관찰하는 곳. 보안경 필수", "과학 준비실": "실험 도구를 보관하는 곳", "컴퓨터실": "정보 수업을 하는 곳",
  "음악실": "광평중은 경북 음악중점학교!", "오케스트라 연습실": "학교 오케스트라가 연습하는 곳", "파트 연습실": "악기별로 따로 연습하는 작은 방",
  "미술실": "그리고 만드는 곳", "가정실": "요리·바느질 실습실", "기술실": "만들고 조립하는 실습실", "수학교실": "수학 수업 전용 교실",
  "멀티미디어실": "영상 보고 발표하는 곳", "홈베이스": "쉬는 시간에 모이는 학년 휴게 공간", "화장실": "깨끗하게 쓰기!", "교구실": "수업 도구 보관실",
  "급식실": "점심 먹는 곳. 먹기 전 손 씻기!", "강당": "체육·행사·공연을 하는 다목적 강당", "특수학급": "함께 배우는 교실",
};

// ---- 건물 층 ----
// 위성사진: 운동장 북동쪽에 계단식 3개 동(서관·본관·동관)이 이어지고 본관 뒤에 강당.
// 설계 논문(2004): 지상 4층, 주출입구 쪽 행정, 가운데 메인홀, 1층 도서관, 학년별 교실 블록, 음악중점.
const WING = { W: { x0: 1, x1: 19, y0: 4, y1: 18, a: [5, 7], b: [12, 17] }, C: { x0: 19, x1: 39, y0: 1, y1: 20, a: [2, 7], b: [12, 19] }, E: { x0: 39, x1: 57, y0: 4, y1: 19, a: [5, 7], b: [12, 18] } };
const FLOORS = {
  1: [["W", "a", 2, 5, "계단"], ["W", "a", 7, 10, "화장실"], ["W", "a", 12, 18, "방송실"], ["W", "b", 2, 9, "교무실"], ["W", "b", 11, 14, "행정실"], ["W", "b", 16, 18, "교장실"],
      ["C", "a", 20, 25, "강당 가는 길"], ["C", "a", 27, 30, "계단"], ["C", "a", 32, 38, "도서관"], ["C", "b", 20, 25, "보건실"], ["C", "b", 27, 32, "메인홀"], ["C", "b", 34, 38, "Wee클래스"],
      ["E", "a", 40, 44, "화장실"], ["E", "a", 46, 52, "교구실"], ["E", "a", 54, 56, "계단"], ["E", "b", 40, 44, "가정실"], ["E", "b", 46, 50, "기술실"], ["E", "b", 52, 56, "특수학급"]],
  2: [["W", "a", 2, 5, "계단"], ["W", "a", 7, 10, "화장실"], ["W", "a", 12, 18, "과학 준비실"], ["W", "b", 2, 9, "과학실"], ["W", "b", 11, 18, "과학실 2"],
      ["C", "a", 20, 25, "컴퓨터실"], ["C", "a", 27, 30, "계단"], ["C", "a", 32, 38, "1학년 교사연구실"], ["C", "b", 20, 25, "멀티미디어실"], ["C", "b", 27, 32, "홈베이스"], ["C", "b", 34, 38, "1학년 4반"],
      ["E", "a", 40, 44, "화장실"], ["E", "a", 46, 52, "교구실"], ["E", "a", 54, 56, "계단"], ["E", "b", 40, 44, "1학년 1반"], ["E", "b", 46, 50, "1학년 2반"], ["E", "b", 52, 56, "1학년 3반"]],
  3: [["W", "a", 2, 5, "계단"], ["W", "a", 7, 10, "화장실"], ["W", "a", 12, 18, "파트 연습실"], ["W", "b", 2, 9, "음악실"], ["W", "b", 11, 18, "오케스트라 연습실"],

// 12x18 픽셀 격자, u = 한 칸 크기
function drawMinimi(c, cx, cy, look, dir, step, u) {
  const [sk, hs, hc, tp, bt, ac] = look;
  const P = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(cx + (x - 6) * u), Math.round(cy + (y - 18) * u), Math.ceil(w * u), Math.ceil(h * u)); };
  const S = SKIN[sk % 4], H = HAIRC[hc % 8], TP = TOPC[tp % 8], B = BOTC[bt % 5];
  c.fillStyle = "rgba(0,0,0,.22)"; c.beginPath(); c.ellipse(cx, cy - u * .3, u * 4.2, u * 1.4, 0, 0, 7); c.fill();
  const bob = step ? 1 : 0;
  // 다리
  const l1 = step === 1 ? 1 : 0, l2 = step === 2 ? 1 : 0;
  P(3.5, 15 - l1, 2, 3 + l1 - bob * 0, B); P(6.5, 15 - l2, 2, 3 + l2, B);
  P(3.5, 17.5 - l1 * 0, 2, .5, "#222"); P(6.5, 17.5, 2, .5, "#222");
  // 몸
  P(3, 10 - bob * .5, 6, 5.5, TP);
  if (tp % 8 === 4) { P(5.5, 10.5 - bob * .5, 1, 4, "#c0504d"); } // 흰 셔츠엔 넥타이
  if (dir === 1) P(5, 11, 2, 3.5, S); else if (dir === 2) P(5, 11, 2, 3.5, S);
  else { P(2, 10.5 - bob * .5, 1, 3.5, TP); P(9, 10.5 - bob * .5, 1, 3.5, TP); P(2, 13.5, 1, 1, S); P(9, 13.5, 1, 1, S); }
  // 머리(크게)
  const hy = -bob * .5;
  P(1.5, 1.5 + hy, 9, 9, S);
  // 머리카락
  const hair = (x, y, w, h) => P(x, y + hy, w, h, H);
  const style = hs % 6;
  if (dir === 3) { hair(1, 1, 10, 7); if (style === 2 || style === 3) hair(2, 8, 8, 3); }
  else {
    if (style === 4) { hair(1.5, 1, 9, 1.5); }
    else if (style === 5) { hair(0.5, 0, 11, 3.5); hair(0.5, 3, 2, 3); hair(9.5, 3, 2, 3); }
    else { hair(1, .5, 10, 3); if (dir !== 2) hair(1, 3, 1.5, style === 0 ? 2 : 6); if (dir !== 1) hair(9.5, 3, 1.5, style === 0 ? 2 : 6); }
    if (style === 2 && dir === 0) { hair(1, 3, 1.5, 7.5); hair(9.5, 3, 1.5, 7.5); }
    if (style === 3) { const sx = dir === 1 ? 10 : dir === 2 ? 0 : 9.5; hair(sx, 4, 2, 4); }
  }
  // 얼굴
  if (dir !== 3) {
    const ex = dir === 1 ? -1.2 : dir === 2 ? 1.2 : 0;
    P(3.8 + ex, 5.5 + hy, 1, 1.6, "#1d1d1d"); P(7.2 + ex, 5.5 + hy, 1, 1.6, "#1d1d1d");
    P(3 + ex, 7.6 + hy, 1.2, .7, "rgba(230,110,110,.55)"); P(7.8 + ex, 7.6 + hy, 1.2, .7, "rgba(230,110,110,.55)");
    P(5.4 + ex, 8.2 + hy, 1.2, .5, "#8a3b2f");
  }
  // 꾸미기
  const acc = ac % 6;
  if (acc === 1 && dir !== 3) { const ex = dir === 1 ? -1.2 : dir === 2 ? 1.2 : 0; P(3 + ex, 5.2 + hy, 2.6, 2.2, "rgba(255,255,255,.25)"); P(6.4 + ex, 5.2 + hy, 2.6, 2.2, "rgba(255,255,255,.25)"); P(2.8 + ex, 5 + hy, 6.4, .5, "#222"); }
  if (acc === 2) { P(1, 0 + hy, 10, 2.4, "#c0504d"); P(dir === 1 ? -1 : dir === 2 ? 8 : 2, 2 + hy, 5, 1, "#a03c39"); }
  if (acc === 3) { P(8, 0 + hy, 2.4, 2, "#e85d8a"); P(10, .4 + hy, 1.4, 1.2, "#e85d8a"); P(6.8, .4 + hy, 1.4, 1.2, "#e85d8a"); }
  if (acc === 4) { P(1, 1 + hy, 10, 1, "#333"); P(0, 4 + hy, 2, 3, "#333"); P(10, 4 + hy, 2, 3, "#333"); }
  if (acc === 5) { P(3, -1.5 + hy, 6, 2, "#e9b84a"); P(3, -2.5 + hy, 1, 1, "#e9b84a"); P(5.5, -2.5 + hy, 1, 1, "#e9b84a"); P(8, -2.5 + hy, 1, 1, "#e9b84a"); }
}

  const s = $("#stick"); s.hidden = false; s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px"; s.firstElementChild.style.transform = "";

cv.addEventListener("pointermove", (e) => {

  if (L > M) { dx = dx / L * M; dy = dy / L * M; }

function goWarp(w) {

function finishWarp() {

// ================= 상호작용 =================

// ================= 효과 =================
function burst(a, x, y, cols, n) { for (let i = 0; i < n; i++) { const an = Math.random() * 7, sp = 1 + Math.random() * 4; parts.push({ a, x, y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 2, life: .6 + Math.random() * .5, max: 1.1, col: cols[i % cols.length], r: 3 + Math.random() * 3, g: 6 }); } }

function openMissions() {
  const rows = STAMPS.map((s) => { const g = me.stamps[s.id]; return `<div class="li ${g ? "got" : ""}"><b>${esc(s.name)}</b><span class="st">${g === 2 ? "금도장" : g === 1 ? "은도장" : "?"}</span></div>`; }).join("");
  openModal(`<h2>미션</h2><p class="sub">도장 ${stampCount()}/${STAMPS.length} · 별 ${me.stars.size}/${STARS.length} · 시간 미션 성공 ${me.wins}번</p>
    <button class="btn gold" id="bChal" style="width:100%">종 치기 전에! 시간 안에 교실 찾아가기</button>
    <div class="list" style="margin-top:10px">${rows}</div>
    <p class="note">도장이 어디 있는지는 직접 찾아보세요. 지도를 보면 교실 이름이 나와요.</p>
    <div class="foot"><button class="btn" id="bReset">처음부터</button><button class="btn" onclick="closeModal()">닫기</button></div>`);
  $("#bChal").onclick = startChallenge;
  $("#bReset").onclick = () => { if (!confirm("도장과 별을 모두 지우고 처음부터 할까요?")) return; me.stamps = {}; me.stars = new Set(); me.startedAt = 0; me.doneAt = 0; persist(); sendProg(); updateHud(); closeModal(); toast("처음부터 다시 시작!"); };
}
function startChallenge() {
  const pool = [];
  for (let f = 1; f <= 4; f++) for (const r of AREAS[f].rooms) if (!/계단|화장실|교구|준비|홈베이스|메인홀|가는 길/.test(r.name)) pool.push({ a: f, r });
  pool.push({ a: 5, r: AREAS[5].rooms[0] }, { a: 5, r: AREAS[5].rooms[1] });
  let pick; do { pick = pool[Math.floor(Math.random() * pool.length)]; } while (pick.a === me.a && pool.length > 1 && Math.random() < .8);
  const dist = (pick.a === me.a ? 0 : 20) + Math.abs(pick.a - me.a) * 10;
  challenge = { a: pick.a, room: pick.r.name, where: `${AREA_NAME(pick.a)} ${pick.r.name}`, until: performance.now() + (45 + dist) * 1000 };
  closeModal(); $("#timer").hidden = false; sfx.warp(); toast(`종 치기 전에 ${challenge.where}(으)로!`);
}
function openCert() {
  const sec = me.doneAt && me.startedAt ? Math.round((me.doneAt - me.startedAt) / 1000) : 0;
  const gold = Object.values(me.stamps).filter((v) => v === 2).length;
  burst(me.a, me.x, me.y - 1, ["#e9b84a", "#c0504d", "#3f8a5c", "#7fb3d5", "#fff"], 80); sfx.goal();
  openModal(`<div class="cert"><p class="sub" style="margin:0">광평중학교 탐험 인증서</p><div class="big-t">${esc(me.nick)}</div>
    <div>학교 구석구석 도장 12개를 모두 찍었습니다</div><div class="stamp">탐험 완료</div>
    <div class="list"><div class="li"><b>금도장</b>${gold}개</div><div class="li"><b>별</b>${me.stars.size}/${STARS.length}</div><div class="li"><b>걸린 시간</b>${Math.floor(sec / 60)}분 ${sec % 60}초</div></div>
    <div class="foot"><button class="btn go" onclick="closeModal()">계속 구경하기</button></div></div>`);
}
function openRank() {
  const list = roster.slice().sort((p, q) => (q.n - p.n) || (q.s - p.s));
  const rows = list.length ? list.map((p, i) => `<div class="li ${p.id === myId ? "me" : ""}"><span class="st">${i + 1}</span><b>${esc(p.nick)}${p.done ? " · 완료" : ""}</b>도장 ${p.n} · 별 ${p.s || 0}</div>`).join("") : `<div class="li">서버에 연결되면 같은 방 친구들이 보여요</div>`;
  openModal(`<h2>순위</h2><p class="sub">방 «${esc(roomCode)}» · ${list.length}명</p><div class="list">${rows}</div><div class="foot"><button class="btn" onclick="closeModal()">닫기</button></div>`);
}
let mapFloor = 0;
function openMap() {
  mapFloor = me.a;
  openModal(`<h2>학교 지도</h2><div class="tabs" id="mtabs">${[0, 1, 2, 3, 4, 5].map((i) => `<button data-a="${i}">${AREA_NAME(i)}</button>`).join("")}</div><div class="mapwrap" id="mapwrap"><canvas id="mapc"></canvas></div><p class="note">빨간 점이 나예요. 노란 점은 같은 층 친구. 지도는 손가락으로 밀어 볼 수 있어요.</p><div class="foot"><button class="btn" onclick="closeModal()">닫기</button></div>`, true);
  $("#mtabs").querySelectorAll("button").forEach((b) => b.onclick = () => { mapFloor = +b.dataset.a; drawMap(); });
  drawMap();
}
function drawMap() {
  const a = AREAS[mapFloor], c = $("#mapc"); if (!c) return;
  $("#mtabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.a === mapFloor));
  const s = 16; c.width = a.w * s; c.height = a.h * s; c.style.width = (a.w * s) + "px"; const g = c.getContext("2d");
  g.imageSmoothingEnabled = true; g.drawImage(a.base, 0, 0, c.width, c.height);
  g.textAlign = "center"; g.font = "800 13px Pretendard,sans-serif";
  for (const r of a.rooms) { if (r.k === "wc") continue; const cx = (r.x0 + r.x1 + 1) / 2 * s, cy = (r.y0 + r.y1 + 1) / 2 * s; const w = g.measureText(r.name).width + 8; g.fillStyle = "rgba(31,42,36,.82)"; g.fillRect(cx - w / 2, cy - 9, w, 16); g.fillStyle = "#fff"; g.fillText(r.name, cx, cy + 3); }
  for (const o of others.values()) if (o.a === mapFloor) { g.fillStyle = "#ffd43b"; g.beginPath(); g.arc(o.x * s, o.y * s, 5, 0, 7); g.fill(); }
  if (me.a === mapFloor) { g.fillStyle = "#e03131"; g.strokeStyle = "#fff"; g.lineWidth = 3; g.beginPath(); g.arc(me.x * s, me.y * s, 8, 0, 7); g.fill(); g.stroke(); const w = $("#mapwrap"); w.scrollLeft = me.x * s - w.clientWidth / 2; w.scrollTop = me.y * s - w.clientHeight / 2; }
}
const EMO = ["👋", "😀", "😂", "😍", "😮", "😢", "😡", "👍", "🎉", "❤️", "⭐", "💯"];
const SAY = ["안녕!", "여기야!", "같이 가자", "어디야?", "찾았다!", "도와줘!", "고마워", "잘했어!", "따라와", "잠깐만", "이쪽 아니야", "빨리 와!", "도장 몇 개야?", "과학실 어디?", "강당 가자", "다 모았다!"];
function openEmo() {
  openModal(`<h2>표정</h2><p class="sub">키보드 숫자 1~9로도 돼요</p><div class="grid">${EMO.map((e, i) => `<button data-i="${i}">${e}</button>`).join("")}</div>`);
  $("#mbody").querySelectorAll(".grid button").forEach((b) => b.onclick = () => { sendEmo(+b.dataset.i); closeModal(); });
}
function openSay() {
  openModal(`<h2>말하기</h2><p class="sub">정해진 말만 할 수 있어요</p><div class="grid say">${SAY.map((e, i) => `<button data-i="${i}">${esc(e)}</button>`).join("")}</div>`);
  $("#mbody").querySelectorAll(".grid button").forEach((b) => b.onclick = () => { sendSay(+b.dataset.i); closeModal(); });
}

// ================= 네트워크 =================
let ws = null, wsOk = false, retry = 0, lastPose = 0, lastPoseKey = "";
function wsUrl() {
  const local = /game\.kimju\.kr$|onrender\.com$|^localhost$|^127\.0\.0\.1$/.test(location.hostname);
  const base = local ? `${location.protocol === "https:" ? "wss" : "ws"}://${location.host}` : "wss://game.kimju.kr";
  return `${base}/campus/ws?room=${encodeURIComponent(roomCode)}`;
}
function connect() {
  try { ws = new WebSocket(wsUrl()); } catch { return schedule(); }
  $("#net").textContent = "연결 중…";
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify({ t: "hi", nick: me.nick, look: me.look, n: stampCount(), s: me.stars.size })); };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === "hi") { myId = m.id; wsOk = true; sendPose(true); sendProg(); }
    else if (m.t === "ro") {
      const had = new Set(others.keys());
      roster = m.list;
      for (const p of m.list) {
        if (p.id === myId) continue;
        let o = others.get(p.id);
        if (!o) { o = { a: -1, x: 0, y: 0, tx: 0, ty: 0, dir: 0, m: 0 }; others.set(p.id, o); if (playing && had.size) toast(`${p.nick} 님이 들어왔어요`, 1800); }
        o.nick = p.nick; o.look = p.look && p.look.length === 6 ? p.look : [0, 0, 0, 0, 0, 0]; o.n = p.n; o.s = p.s;
        had.delete(p.id);
      }
      for (const id of had) others.delete(id);
      $("#net").textContent = `방 «${roomCode}» · ${m.list.length}명 접속`;
    } else if (m.t === "st") {
      for (const [id, a, x, y, d, mv] of m.p) {
        if (id === myId) continue; const o = others.get(id); if (!o) continue;
        const nx = x / 10, ny = y / 10;
        if (o.a !== a) { o.x = nx; o.y = ny; }
        o.a = a; o.tx = nx; o.ty = ny; o.dir = d; o.m = mv;
      }
    } else if (m.t === "e" || m.t === "s") {
      const o = m.id === myId ? me : others.get(m.id); if (!o) return;
      o.bubble = m.t === "e" ? { text: EMO[m.e], big: true, until: performance.now() + 2600 } : { text: SAY[m.s], until: performance.now() + 3200 };
      if (m.id !== myId && o.a === me.a) sfx.pop();
    } else if (m.t === "win") {
      const p = roster.find((r) => r.id === m.id); if (m.id !== myId && p) { toast(`${p.nick} 님이 학교 탐험을 끝냈어요!`); burst(me.a, me.x, me.y - 2, ["#e9b84a", "#fff", "#c0504d"], 30); }
    }
  };
  ws.onclose = () => { wsOk = false; myId = null; others.clear(); roster = []; $("#net").textContent = "혼자 탐험 중 (다시 연결하는 중)"; schedule(); };
  ws.onerror = () => {};
}
function schedule() { retry++; setTimeout(connect, Math.min(15000, 1000 * 2 ** Math.min(retry, 4))); }
const sendRaw = (o) => { if (ws && wsOk && ws.readyState === 1) ws.send(JSON.stringify(o)); };
function sendPose(force) {
  const key = `${me.a},${me.x.toFixed(1)},${me.y.toFixed(1)},${me.dir},${me.moving ? 1 : 0}`;
  if (!force && key === lastPoseKey) return;
  lastPoseKey = key; lastPose = performance.now();
  sendRaw({ t: "p", a: me.a, x: Math.round(me.x * 10) / 10, y: Math.round(me.y * 10) / 10, d: me.dir, m: me.moving ? 1 : 0 });
}
function netTick() { const now = performance.now(); if (now - lastPose > 100) sendPose(now - lastPose > 3000); }
function sendProg() { sendRaw({ t: "g", n: stampCount(), s: me.stars.size, done: stampCount() === STAMPS.length }); }
let lastEmo = 0;
function sendEmo(i) {
  if (performance.now() - lastEmo < 700) return; lastEmo = performance.now();
  me.bubble = { text: EMO[i], big: true, until: performance.now() + 2600 };
  sendRaw({ t: "e", e: i });
}
function sendSay(i) {
  if (performance.now() - lastEmo < 700) return; lastEmo = performance.now();
  me.bubble = { text: SAY[i], until: performance.now() + 3200 };
  sendRaw({ t: "s", s: i });
}

// ================= 시작 화면(미니미 꾸미기) =================
function renderParts() {
  $("#parts").innerHTML = PARTS.map(([n], i) => `<div class="part"><button data-i="${i}" data-d="-1">◀</button><span>${n}: ${PART_LABEL(i, me.look[i])}</span><button data-i="${i}" data-d="1">▶</button></div>`).join("");
  $("#parts").querySelectorAll("button").forEach((b) => b.onclick = () => { const i = +b.dataset.i; me.look[i] = (me.look[i] + (+b.dataset.d) + PARTS[i][1]) % PARTS[i][1]; renderParts(); });
  drawPreview();
}
let pvDir = 0;
function drawPreview() {
  const c = $("#preview").getContext("2d"); c.imageSmoothingEnabled = false;
  c.fillStyle = "#cfe6c4"; c.fillRect(0, 0, 112, 140);
  c.fillStyle = "#b9d7ab"; c.fillRect(0, 108, 112, 32);
  drawMinimi(c, 56, 124, me.look, pvDir, 0, 6);
}
setInterval(() => { if (!playing) { pvDir = (pvDir + 1) % 4; drawPreview(); } }, 1200);
$("#rand").onclick = () => { me.look = PARTS.map(([, n]) => Math.floor(Math.random() * n)); renderParts(); };
$("#nick").value = me.nick;
const qRoom = new URLSearchParams(location.search).get("room");
$("#room").value = qRoom || save.room || "";
$("#go").onclick = () => {
  const nick = $("#nick").value.replace(/[<>&"'`]/g, "").trim().slice(0, 8);
  if (!nick) { $("#nick").focus(); toast("별명을 적어 주세요"); return; }
  me.nick = nick;
  roomCode = ($("#room").value.replace(/[<>&"'`]/g, "").trim().slice(0, 12)) || "광평";
  save.room = $("#room").value.trim();
  persist();
  $("#start").hidden = true; $("#hud").hidden = false; playing = true;
  sfx.warp(); updateHud(); connect();
  toast(stampCount() ? `다시 왔군요! 도장 ${stampCount()}개에서 이어서` : "정문에서 출발! 메인홀로 들어가 보세요");
};
$("#bAct").onclick = act;
$("#bRun").onclick = () => { me.run = !me.run; $("#bRun").classList.toggle("on", me.run); };
$("#bEmo").onclick = openEmo; $("#bSay").onclick = openSay;
$("#bMap").onclick = openMap; $("#bMis").onclick = openMissions; $("#bRank").onclick = openRank;
$("#bSnd").onclick = () => { soundOn = !soundOn; persist(); $("#bSnd").innerHTML = `소리<br>${soundOn ? "켬" : "끔"}`; };
$("#bSnd").innerHTML = `소리<br>${soundOn ? "켬" : "끔"}`;
for (const b of document.querySelectorAll("#ctl button,#hud .tr button")) b.addEventListener("pointerdown", (e) => e.stopPropagation());

// ================= 시작 =================
function boot() {
  for (const a of AREAS) prerender(a);
  renderParts();
  let last = performance.now();
  const loop = (now) => { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); draw(now); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
(document.fonts && document.fonts.load ? document.fonts.load("800 12px Pretendard").catch(() => {}) : Promise.resolve()).then(boot);
window.__campus = { me, AREAS, STAMPS, STARS, others, act, at, SOLID, get ws() { return ws; } };
</script>
