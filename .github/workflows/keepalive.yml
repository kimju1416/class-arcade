# Render 무료 서버가 15분 유휴 후 잠드는 것을 방지하는 킵얼라이브 핑.
# 매일 07:00~22:00 KST(= 22:00~13:00 UTC)에 10분 간격으로 /health를 두드린다.
# 24시간 핑을 하지 않는 이유: Render 무료 750시간/월을 같은 계정의 다른 서비스와 나눠 쓰기 때문.
# 심야에 접속하면 첫 화면만 ~50초 걸리고 그 뒤로는 정상.
name: keep-alive
on:
  schedule:
    - cron: '*/10 22-23 * * *'   # 07:00~08:59 KST
    - cron: '*/10 0-12 * * *'    # 09:00~21:59 KST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health
        run: |
          # 잠든 서버는 첫 응답이 느릴 수 있어 한 번 더 시도한다
          curl -fsS --max-time 40 https://class-arcade-i6xj.onrender.com/health \
            || (sleep 20 && curl -fsS --max-time 60 https://class-arcade-i6xj.onrender.com/health)
