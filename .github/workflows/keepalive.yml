# Render 무료 서버가 15분 유휴 후 잠드는 것을 방지하는 킵얼라이브 핑.
# 24시간 10분 간격으로 /health를 두드린다 — 저녁·새벽에 접속해도 기다리지 않게.
#
# 비용 주의: Render 무료는 계정당 월 750 인스턴스-시간이다. 24시간 켜 두면
# 이 서비스 하나가 월 ~730시간을 쓴다. 같은 계정의 다른 무료 서비스(학교 MCP 등)가
# 있으면 한도를 거의 다 먹는다. 시간대를 좁히려면 아래 cron을 줄이고,
# 서버 쪽은 Render 환경변수 KEEPALIVE_HOURS='7-22' 처럼 지정하면 된다.
name: keep-alive
on:
  schedule:
    - cron: '*/10 * * * *'   # 24시간, 10분 간격
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping /health
        run: |
          # 잠든 서버는 첫 응답이 느릴 수 있어 한 번 더 시도한다
          curl -fsS --max-time 40 https://class-arcade-i6xj.onrender.com/health \
            || (sleep 20 && curl -fsS --max-time 60 https://class-arcade-i6xj.onrender.com/health)
